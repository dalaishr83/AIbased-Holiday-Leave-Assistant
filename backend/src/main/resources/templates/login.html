<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Holiday Leave Assistant</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
            font-size: 15px; line-height: 1.5;
            background: #e4e8ee;                   /* fix 1.1 — match reference blue-grey */
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }

        /* ── Card ── */
        .card {
            background: #fff;
            border-radius: 16px;                   /* fix 2.2 — moderate rounding to match reference */
            padding: 30px 44px 44px;               /* fix 2.4 — reduced top padding (48→30) */
            width: 100%; max-width: 460px;         /* fix 2.1 — narrower card (480→460) */
            box-shadow: 0 2px 16px rgba(0,0,0,.06); /* fix 2.3 — softer shadow */
        }

        /* ── Avatar area ── */
        .avatar-wrap {
            display: flex; justify-content: center;
            margin-bottom: 14px;                   /* fix 3.6 — tighter gap below robot (24→14) */
        }

        /* Robot SVG container */
        .robot-svg {
            width: 90px; height: 90px;             /* fix 3.1 — reduce from 110→90 px */
        }

        /* Animations */
        /* Whole robot: gentle float up/down */
        .robot-body-group {
            animation: robotFloat 3.6s ease-in-out infinite;
            transform-origin: 50% 70%;
        }
        @keyframes robotFloat {
            0%,100% { transform: translateY(0px); }
            50%      { transform: translateY(-5px); }
        }

        /* Eyes: blink */
        .robot-eye {
            animation: eyeBlink 4s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: 50% 50%;
        }
        .robot-eye:nth-child(2) { animation-delay: .07s; }
        @keyframes eyeBlink {
            0%,88%,100% { transform: scaleY(1); }
            92%          { transform: scaleY(0.08); }
        }

        /* Antenna glow */
        .robot-antenna-tip {
            animation: antennaPulse 2s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: 50% 50%;
        }
        @keyframes antennaPulse {
            0%,100% { opacity: 1;   r: 4; }
            50%     { opacity: 0.5; r: 5.5; }
        }

        /* Arms: slight rock */
        .robot-arm-l {
            animation: armRock 3.6s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: 100% 30%;
        }
        .robot-arm-r {
            animation: armRock 3.6s ease-in-out infinite reverse;
            transform-box: fill-box;
            transform-origin: 0% 30%;
        }
        @keyframes armRock {
            0%,100% { transform: rotate(0deg); }
            30%     { transform: rotate(-8deg); }
            70%     { transform: rotate(8deg); }
        }

        /* Mouth glow */
        .robot-mouth {
            animation: mouthGlow 2.8s ease-in-out infinite;
        }
        @keyframes mouthGlow {
            0%,100% { opacity: 0.9; }
            50%     { opacity: 0.4; }
        }

        /* ── Headings ── */
        .card-title {
            text-align: center;
            font-size: 20px; font-weight: 700;     /* fix 4.1 — reduce from 22→20 px */
            color: #111827; margin-bottom: 4px;    /* fix 4.2 — near-black; fix 7.1 — tighter gap */
        }
        .card-sub {
            text-align: center;
            font-size: 14px; color: #6b7280;       /* fix 4.3 — standard mid-grey */
            margin-bottom: 32px;
        }

        /* ── Error ── */
        .error-msg {
            background: #fff0f0; border: 1px solid #fca5a5;
            color: #b91c1c; border-radius: 10px;
            padding: 11px 16px; margin-bottom: 20px;
            font-size: 13px;
        }

        /* ── Form ── */
        .field { margin-bottom: 20px; }

        /* Icon + input wrapper */
        .input-wrap {
            position: relative;
        }
        .input-wrap .field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 17px; height: 17px;
            pointer-events: none;
            display: flex; align-items: center; justify-content: center;
        }
        .input-wrap .field-icon svg {
            width: 17px; height: 17px;
            display: block;
        }

        .field input {
            width: 100%;
            background: #fef9c3;
            border: 1px solid #e9e2a0;
            border-radius: 8px;
            padding: 14px 16px 14px 42px;          /* extra left padding to clear icon */
            font-size: 15px; font-family: inherit;
            color: #1a2332; outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .field input:focus {
            border-color: #2952d9;
            box-shadow: 0 0 0 3px rgba(41,82,217,.12);
            background: #fffef5;
        }

        /* ── Button ── */
        .btn-signin {
            width: 100%; margin-top: 16px;         /* fix 6.5 — increase top margin 8→16 px */
            background: #2952d9;                   /* fix 6.1 — deeper, richer blue */
            color: #fff; border: none;
            border-radius: 50px;                   /* fix 6.2 — pill shape */
            padding: 16px;                         /* fix 6.3 — slightly taller CTA */
            font-size: 16px; font-weight: 600; font-family: inherit;
            cursor: pointer; letter-spacing: .01em;
            transition: background .15s, transform .1s;
        }
        .btn-signin:hover  { background: #1f45c8; }
        .btn-signin:active { transform: scale(0.99); }

        /* ── Footer ── */
        footer {
            text-align: center; margin-top: 32px;
            font-size: 11px; color: #aab4be;
        }
    </style>
</head>
<body>

<div class="card">

    <!-- Animated robot avatar -->
    <div class="avatar-wrap">
        <!--
            Robot SVG redrawn at the same 120×130 viewBox.
            Colours shifted to deeper royal blue (#1c3fa0 body, #173296 neck/arms/legs,
            #3b9eff antenna tip) to match the darker palette in the reference screenshot.
        -->
        <svg class="robot-svg" viewBox="0 0 120 130" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="robot-body-group">
                <!-- Antenna stem -->
                <rect x="58" y="6" width="4" height="18" rx="2" fill="#1c3fa0"/>
                <!-- Antenna tip — pulsing; fix 3.2: vivid cyan-blue -->
                <circle class="robot-antenna-tip" cx="60" cy="5" r="4" fill="#3b9eff"/>

                <!-- Head; fix 3.3: deeper royal blue -->
                <rect x="28" y="22" width="64" height="46" rx="14" fill="#1c3fa0"/>

                <!-- Eyes -->
                <rect class="robot-eye" x="38" y="36" width="16" height="16" rx="5" fill="#fff"/>
                <rect class="robot-eye" x="66" y="36" width="16" height="16" rx="5" fill="#fff"/>
                <!-- Eye pupils -->
                <circle cx="46" cy="44" r="5" fill="#0d2260"/>
                <circle cx="74" cy="44" r="5" fill="#0d2260"/>
                <!-- Eye shine -->
                <circle cx="48" cy="41" r="2" fill="#7ec8fa"/>
                <circle cx="76" cy="41" r="2" fill="#7ec8fa"/>

                <!-- Mouth / speaker grille -->
                <rect class="robot-mouth" x="44" y="57" width="32" height="5" rx="2.5" fill="#7ec8fa"/>

                <!-- Neck -->
                <rect x="54" y="68" width="12" height="8" rx="3" fill="#173296"/>

                <!-- Body -->
                <rect x="22" y="76" width="76" height="44" rx="14" fill="#1c3fa0"/>

                <!-- Body panel dots -->
                <circle cx="44" cy="98" r="5" fill="#0d2260"/>
                <circle cx="60" cy="98" r="5" fill="#3b9eff"/>
                <circle cx="76" cy="98" r="5" fill="#0d2260"/>

                <!-- Body panel line -->
                <rect x="34" y="109" width="52" height="4" rx="2" fill="#173296"/>

                <!-- Arms -->
                <rect class="robot-arm-l" x="4" y="78" width="18" height="30" rx="9" fill="#173296"/>
                <rect class="robot-arm-r" x="98" y="78" width="18" height="30" rx="9" fill="#173296"/>

                <!-- Legs -->
                <rect x="34" y="120" width="18" height="10" rx="5" fill="#173296"/>
                <rect x="68" y="120" width="18" height="10" rx="5" fill="#173296"/>
            </g>
        </svg>
    </div>

    <h1 class="card-title">Holiday Leave Assistant</h1>
    <p class="card-sub">Sign in to continue</p>

    <!-- Error message -->
    <div th:if="${error}" class="error-msg" th:text="${error}"></div>

    <form method="POST" th:action="@{/login}">

        <div class="field">
            <div class="input-wrap">
                <span class="field-icon" aria-hidden="true">
                    <!-- User / person icon -->
                    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="10" cy="7" r="3.5" stroke="#111827" stroke-width="1.6"/>
                        <path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </span>
                <input type="text"
                       id="username" name="username"
                       aria-label="Username"
                       autocomplete="username"
                       placeholder="Username"
                       required>
            </div>
        </div>

        <div class="field">
            <div class="input-wrap">
                <span class="field-icon" aria-hidden="true">
                    <!-- Padlock icon -->
                    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="9" width="12" height="9" rx="2" stroke="#111827" stroke-width="1.6"/>
                        <path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
                        <circle cx="10" cy="13.5" r="1.2" fill="#111827"/>
                    </svg>
                </span>
                <input type="password"
                       id="password" name="password"
                       aria-label="Password"
                       autocomplete="current-password"
                       placeholder="Password"
                       required>
            </div>
        </div>

        <button type="submit" class="btn-signin">Sign in</button>
    </form>
</div>
</body>
</html>
