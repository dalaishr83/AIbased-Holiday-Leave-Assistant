<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PC Approvals — Holiday Leave Assistant</title>
    <link rel="stylesheet" th:href="@{/static/holiday_agent.css}">
    <style>
        .approvals-page { max-width: 860px; margin: 0 auto; padding: 32px 20px; }
        .approvals-page h1 { font-size: 1.4rem; margin-bottom: 8px; }
        .approvals-page .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-size:.85rem; margin-bottom:20px; }
        .approvals-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
        .approvals-card h2 { font-size: 1rem; margin: 0 0 14px 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: .85rem; }
        th { text-align: left; padding: 8px 10px; background: var(--bg); color: var(--muted); font-weight: 600; border-bottom: 2px solid var(--border); }
        td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
        tr:last-child td { border-bottom: none; }
        .btn-approve { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px 18px; cursor: pointer; font-size: .85rem; margin-top: 16px; }
        .btn-approve:disabled { background: #9ca3af; cursor: not-allowed; }
        .btn-approve:hover:not(:disabled) { background: var(--accent-hover); }
        .select-all-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size:.85rem; color:var(--muted); }
        .alert { padding: 10px 14px; border-radius: 6px; font-size: .85rem; margin-top: 12px; display: none; }
        .alert.success { background: #d1fae5; color: #065f46; }
        .alert.error   { background: #fee2e2; color: #991b1b; }
        .empty-msg { color: var(--muted); font-size: .85rem; padding: 16px 0; }
    </style>
</head>
<body style="background:var(--main-bg);overflow:auto;">

<div class="approvals-page">
    <a href="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Dashboard
    </a>
    <h1>PC Vacation Approvals</h1>

    <div class="approvals-card">
        <h2>Pending Personal Choice Holiday (PC) Entries</h2>

        <div th:if="${pcRecords.isEmpty()}" class="empty-msg">
            No PC vacation entries found in the loaded file.
        </div>

        <div th:if="${!pcRecords.isEmpty()}">
            <div class="select-all-row">
                <input type="checkbox" id="selectAll">
                <label for="selectAll">Select all</label>
            </div>
            <table>
                <thead>
                    <tr>
                        <th></th>
                        <th>Employee</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Days</th>
                        <th>Year</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="rec : ${pcRecords}">
                        <td><input type="checkbox" class="row-check"
                                   th:data-employee="${rec.employee_name}"
                                   th:data-start="${rec.start_date}"
                                   th:data-end="${rec.end_date}"></td>
                        <td th:text="${rec.employee_name}"></td>
                        <td th:text="${rec.start_date}"></td>
                        <td th:text="${rec.end_date}"></td>
                        <td th:text="${rec.days}"></td>
                        <td th:text="${rec.year}"></td>
                    </tr>
                </tbody>
            </table>
            <button class="btn-approve" id="approveBtn" disabled>Approve Selected as Vacation (V)</button>
            <div class="alert" id="approvalAlert"></div>
        </div>
    </div>
</div>

<script>
(function () {
    var selectAll = document.getElementById('selectAll');
    var approveBtn = document.getElementById('approveBtn');
    if (!selectAll || !approveBtn) return;

    function updateApproveBtn() {
        var any = document.querySelectorAll('.row-check:checked').length > 0;
        approveBtn.disabled = !any;
    }

    if (selectAll) {
        selectAll.addEventListener('change', function () {
            document.querySelectorAll('.row-check').forEach(function (cb) {
                cb.checked = selectAll.checked;
            });
            updateApproveBtn();
        });
    }

    document.querySelectorAll('.row-check').forEach(function (cb) {
        cb.addEventListener('change', updateApproveBtn);
    });

    approveBtn.addEventListener('click', function () {
        var selected = [];
        document.querySelectorAll('.row-check:checked').forEach(function (cb) {
            selected.push({
                employee_name: cb.getAttribute('data-employee'),
                start_date:    cb.getAttribute('data-start'),
                end_date:      cb.getAttribute('data-end')
            });
        });
        if (selected.length === 0) return;

        approveBtn.disabled = true;
        fetch('/api/admin/approvals/approve-pc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ approvals: selected })
        }).then(function (r) { return r.json(); }).then(function (data) {
            var alert = document.getElementById('approvalAlert');
            if (data.error) {
                alert.textContent = data.error;
                alert.className = 'alert error';
            } else {
                alert.textContent = data.message + (data.errors && data.errors.length ? ' Errors: ' + data.errors.join('; ') : '');
                alert.className = 'alert success';
                // Reload page to refresh the list
                setTimeout(function () { window.location.reload(); }, 1500);
            }
            alert.style.display = 'block';
        }).catch(function () {
            var alert = document.getElementById('approvalAlert');
            alert.textContent = 'Request failed. Please try again.';
            alert.className = 'alert error';
            alert.style.display = 'block';
            approveBtn.disabled = false;
        });
    });
})();
</script>
</body>
</html>
